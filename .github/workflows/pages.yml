name: Publish leaderboard

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Refresh arXiv papers]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Package public website assets only
        run: |
          mkdir -p _site
          cp -- *.html *.css *.js *.svg *.png robots.txt .nojekyll *LICENSE.txt *NOTICE.txt _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy approved website
        id: deployment
        uses: actions/deploy-pages@v4
