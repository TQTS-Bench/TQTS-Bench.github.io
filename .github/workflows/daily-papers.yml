name: Refresh arXiv papers

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-discovery
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'PyMuPDF>=1.26,<2'
      - uses: actions/cache@v4
        with:
          path: .cache
          key: discovery-v2-${{ github.run_id }}
          restore-keys: discovery-v2-
      - name: Test evidence filtering
        run: python -m unittest discover -s tests -v
      - name: Collect papers without extracting scores
        id: collect
        continue-on-error: true
        run: python collect_papers.py --data discovery.json --policy discovery-policy.json --script discovery.js
      - name: Commit local discovery state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add discovery.json discovery.js
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh benchmark-linked papers'
            git push
          fi
      - name: Report incomplete collection
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'Collection incomplete. Prior confirmed records retained; last successful timestamp unchanged.'
          exit 1

# Collection intentionally has no Pages deployment permissions or steps.
# The independent Publish leaderboard workflow packages the website after collection.
